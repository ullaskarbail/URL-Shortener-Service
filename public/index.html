<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps URL Shortener</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; }
        input { padding: 10px; width: 80%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; cursor: pointer; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #004494; }
        #result { margin-top: 20px; font-size: 18px; }
        #result a { color: #28a745; text-decoration: none; font-weight: bold; }
        #result a:hover { text-decoration: underline; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps URL Shortener</h1>
        <p>A simple app demonstrating a complete CI/CD pipeline.</p>
        <input type="text" id="urlInput" placeholder="Enter a long URL here (e.g., https://example.com)">
        <br>
        <button onclick="shortenUrl()">Shorten URL</button>
        <div id="result"></div>
    </div>

    <script>
        async function shortenUrl() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Processing...';
            
            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ originalUrl: url })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `Success! Your short URL: <br><br><a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">Error: ${data.error}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">Network error occurred. Make sure the server is running.</span>';
            }
        }
    </script>
</body>
</html>
